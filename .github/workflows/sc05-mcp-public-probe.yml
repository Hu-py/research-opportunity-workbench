name: SC05 isolated MCP public handshake (no credentials)

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/sc05-owner-mcp-public-probe-20261119'
    paths:
      - 'scripts/sc05_mcp_public_probe.py'
      - 'tests/test_sc05_mcp_public_probe.py'
      - '.github/workflows/sc05-mcp-public-probe.yml'

permissions:
  contents: read

jobs:
  isolated-mcp-public:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test probe classification offline
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_sc05_mcp_public_probe.py
      - name: Probe public unauthenticated OAuth/MCP endpoints only
        env:
          SC05_MCP_PUBLIC: https://research-atlas-devstudio-e2e-ejmh.onrender.com
        run: |
          mkdir -p artifacts
          python -m scripts.sc05_mcp_public_probe \
            --base "$SC05_MCP_PUBLIC" --timeout 45 \
            --output artifacts/sc05_mcp_public_report.json
      - name: Upload redacted connection status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc05-mcp-noauth-public-status
          path: artifacts/sc05_mcp_public_report.json
          if-no-files-found: ignore
          retention-days: 7
