name: Atlas one-time missed-paper OpenAlex diagnostics

on:
  push:
    branches:
      - feature/atlas-three-source-ai-workflow-v01
    paths:
      - experiments/atlas_pilot_2026_11_14/RUN_PROBE_ONCE.txt

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Probe public OpenAlex works for four misses
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -m experiments.atlas_pilot_2026_11_14.probe_missing
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-pilot-index-diagnostics
          path: scratch/atlas_pilot_missing_probes.json
          retention-days: 14
          if-no-files-found: warn
