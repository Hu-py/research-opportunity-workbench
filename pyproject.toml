[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-opportunity-workbench"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2,<3",
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<47"
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
ai = ["openai>=1.60,<3"]
legacy-ui = ["streamlit>=1.38,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
research-wb = "research_workbench.cli:main"
research-wb-worker = "backend.worker:main"

[tool.setuptools.packages.find]
include = ["research_workbench*", "backend*"]

[tool.setuptools.package-data]
backend = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
