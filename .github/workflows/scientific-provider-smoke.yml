name: Scientific Academic Provider Smoke

on:
  push:
    branches: [feat/scientific-tool-registry-20261105]
    paths:
      - "scripts/scientific_provider_smoke.py"
      - ".github/workflows/scientific-provider-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scoped provider dependencies
        run: python -m pip install "httpx>=0.27,<1" "pydantic>=2,<3" "sqlalchemy>=2,<3" "fastapi>=0.115,<1" "argon2-cffi>=23.1,<26" "cryptography>=43,<47"
      - name: Exercise real academic API adapters
        run: python -m scripts.scientific_provider_smoke
