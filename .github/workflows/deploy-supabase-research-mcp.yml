name: Deploy native Supabase Research MCP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy the reviewed read-only MCP function
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-research-mcp
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Require authenticated Supabase management access
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN. Add it in GitHub Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Checkout reviewed Supabase-only MCP commit
        uses: actions/checkout@v4
        with:
          # Reviewed, CI-tested feature commit. Never check out an input ref
          # while using the deployment-management token.
          ref: ea7decf4f1d64bccaf141426ff1bf3e882d60dc7
          persist-credentials: false
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy one function, disabled by default
        run: |
          supabase functions deploy research-advisor-mcp \
            --project-ref tfyfupxabojddixwjkat \
            --use-api \
            --no-verify-jwt
      - name: Confirm endpoint (disabled until separately approved)
        run: |
          echo "Function deployed to the existing team Supabase project."
          echo "Research data remains unavailable unless RESEARCH_MCP_ENABLED=true"
          echo "and both exact OAuth user/client allowlists are configured."
