name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    name: Python API, Agent & legacy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API, Agent and test dependencies
        run: python -m pip install -e '.[test,ai,legacy-ui]'
      - name: Compile Python sources
        run: python -m compileall -q app.py backend research_workbench
      - name: Run backend integration tests
        run: python -m pytest -q
      - name: Streamlit legacy UI smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app=AppTest.from_file("app.py",default_timeout=30).run()
          assert not app.exception,app.exception
          PY

  frontend:
    name: Next.js build and TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  dev-tracker:
    name: Standalone tracker static sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate independent tracker JS
        run: node --check dev-tracker/app.js
      - name: Validate tracker schema and source references
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("dev-tracker")
          assert (p/"index.html").exists() and (p/"style.css").exists()
          data=json.loads((p/"roadmap.json").read_text(encoding="utf-8"))
          assert len(data["tracks"])>=3
          issues=[m["issue"] for m in data["milestones"]]
          assert len(issues)==len(set(issues))
          assert all(m["track"] in {t["id"] for t in data["tracks"]} for m in data["milestones"])
          assert "api.github.com" in (p/"app.js").read_text(encoding="utf-8")
          print("Independent tracker schema valid")
          PY
