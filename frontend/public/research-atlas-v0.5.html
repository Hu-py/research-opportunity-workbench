const glyphs={chat:'<path d="M20 11.5a7.6 7.6 0 0 1-8.1 7.5c-1.2 0-2.4-.2-3.4-.8L4 19.5l1.3-4A7.6 7.6 0 1 1 20 11.5Z"/>',layers:'<path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/>',search:'<circle cx="10.8" cy="10.8" r="7"/><path d="m16 16 5 5"/>',plus:'<path d="M12 5v14M5 12h14"/>',folder:'<path d="M3 6h6l2 2h10v11H3V6Z"/>',radar:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',database:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m10 2-.5 2.4L7 5.5 5 4l-2 3 2 1.9v3.2L3 14l2 3 2.5-1 2 1L10 20h4l.5-3 2-1 2.5 1 2-3-2-1.9V8.9L21 7l-2-3-2 1.5-2.5-1L14 2h-4Z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',arrow:'<path d="M4 12h16m-7-7 7 7-7 7"/>',up:'<path d="M5 19 19 5M8 5h11v11"/>',chevron:'<path d="m9 18 6-6-6-6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',file:'<path d="M6 2h8l5 5v15H6V2Zm8 0v5h5M9 12h7M9 16h7"/>',book:'<path d="M4 4h6c2 0 3 1 3 3v13c0-2-1-3-3-3H4V4Zm9 3c0-2 1-3 3-3h4v13h-4c-2 0-3 1-3 3V7Z"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',external:'<path d="M14 3h7v7M21 3l-9 9M21 14v7H3V3h7"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M2 20v-2a7 7 0 0 1 14 0v2M17 5a3 3 0 0 1 0 6M22 20v-2a6 6 0 0 0-4-5"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>',send:'<path d="m3 20 18-8L3 4l3 8-3 8Zm3-8h15"/>',check:'<path d="m4 12 5 5L20 6"/>',filter:'<path d="M4 5h16l-6 7v6l-4 2v-8L4 5Z"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="1"/><path d="M5 16H4V3h12v2"/>',eye:'<path d="M2 12c3-5 7-8 10-8s7 3 10 8c-3 5-7 8-10 8S5 17 2 12Z"/><circle cx="12" cy="12" r="3"/>'};
function ico(n,s=17){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(glyphs[n]||glyphs.file)+'</svg>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const examples={topics:[{id:'t1',title:'城市健康的跨区域泛化',desc:'研究多区域样本异质性、外部验证和稳健的城市健康预测方法。',owner:'研究成员',status:'进行中',updated:'2026.11.12',count:12},{id:'t2',title:'京津冀水治理的情景与策略',desc:'整理相关研究场景、事件机制与可迁移的方法链。',owner:'研究团队',status:'待审查',updated:'2026.11.10',count:8},{id:'t3',title:'城市三维功能与空间联系',desc:'关注空间功能识别、跨时相变化以及城市智能化测量问题。',owner:'研究成员',status:'进行中',updated:'2026.11.08',count:6}],signals:[{id:'s1',year:'2026',kind:'A',label:'规划应用',title:'多城市研究中外部有效性问题的持续关注',desc:'从真实城市应用场景观察数据迁移、采样差异与方法评价的需求。',meta:'研究问题 · 多篇文献综合'},{id:'s2',year:'2026',kind:'B',label:'城市科学',title:'城市智能化测量与空间联系的新视角',desc:'梳理新指标、城市系统依赖与研究问题重构的近期方向。',meta:'研究视角 · 待审核信号'},{id:'s3',year:'2025',kind:'C',label:'计算方法',title:'少标签时空学习与图表征方法',desc:'关注标签稀缺、结构迁移及特征传播的技术路径与应用边界。',meta:'方法学习 · 示例信息'},{id:'s4',year:'2025',kind:'A',label:'规划应用',title:'城市热环境与适应性治理策略',desc:'从实际规划实践中识别环境评价、策略与空间实施的衔接需求。',meta:'应用场景 · 示例信息'}],knowledge:[{id:'k1',type:'论文',title:'跨区域城市健康研究方法（示例索引）',desc:'论文元数据、可用摘要与外部来源链接。',source:'来源链接待核实',status:'待审核'},{id:'k2',type:'方法',title:'空间图特征聚合',desc:'输入需求、邻域关系、适用边界与验证方式。',source:'源论文待关联',status:'知识候选'},{id:'k3',type:'场景',title:'区域水治理情景',desc:'研究对象、治理事件和可能的策略要素。',source:'源论文待关联',status:'知识候选'},{id:'k4',type:'问题',title:'外部有效性与样本分布差异',desc:'研究问题定义、验证思路和相关方法。',source:'源论文待关联',status:'待审核'}]};
const state={space:'chat',module:'topics',thread:'p1',chatSearch:'',scope:'private',evidence:false,topicId:null,topicTab:'概览',discoveryTab:'信号',source:'全部',signalQuery:'',knowledgeTab:'论文索引',knowledgeQuery:'',knowledgeSelected:'k1',profileScope:'team',settingTab:'成员与权限',toggle:false,mobile:false,localMessages:{},previousSpace:'chat'};
const threads=[{id:'p1',name:'城市健康外推方法',scope:'private'},{id:'p2',name:'三维空间功能识别',scope:'private'},{id:'p3',name:'水治理案例整理',scope:'private'},{id:'g1',name:'周报研究讨论',scope:'team'},{id:'g2',name:'论文方法交流',scope:'team'}];
const researchItems=[{id:'topics',label:'研究专题',icon:'folder',hint:'持续研究与协作'},{id:'discovery',label:'科研发现',icon:'radar',hint:'三来源监测与报告'},{id:'knowledge',label:'知识资产',icon:'database',hint:'论文、画像与知识'},{id:'settings',label:'管理与设置',icon:'settings',hint:'成员、模型与配置'}];
function toast(msg){const x=document.getElementById('toast');x.textContent=msg;x.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>x.classList.remove('show'),2800)}
function setSpace(s){state.space=s;state.mobile=false;state.evidence=false;render()}
function setModule(s){state.module=s;state.topicId=null;state.mobile=false;render()}
function navThread(id){state.thread=id;const t=threads.find(x=>x.id===id);state.scope=t?.scope||'private';render()}
function newThread(){const id='new'+Date.now();threads.unshift({id,name:'新对话',scope:state.scope});state.thread=id;state.localMessages[id]=[];render();toast('已创建本地演示会话，不会保存到服务器')}
function toggleScope(scope){state.scope=scope;const t=threads.find(x=>x.scope===scope);if(t)state.thread=t.id;render()}
function pageTitle(){if(state.space==='chat')return ['对话',threads.find(t=>t.id===state.thread)?.name||'新对话'];const x=researchItems.find(x=>x.id===state.module);return ['研究台',x?.label||'研究专题']}
function renderContext(){let s='';if(state.space==='chat'){
 const f=threads.filter(t=>t.name.includes(state.chatSearch));s=`<div class="context-head"><div class="context-title">对话</div><span class="tiny-badge">个人 / 团队</span></div><div class="sidebar-top-actions"><button class="new-btn" onclick="newThread()">${ico('plus',14)} 新建对话</button></div><div class="side-search" style="padding-top:12px"><input id="threadSearch" class="thin-input" placeholder="搜索会话" value="${esc(state.chatSearch)}" oninput="state.chatSearch=this.value;renderContextPreserve()"></div><div class="context-scroll"><div class="context-label">私人会话</div>${f.filter(t=>t.scope==='private').map(t=>`<button class="side-item ${state.thread===t.id?'active':''}" onclick="navThread('${t.id}')">${ico('lock')}<span>${esc(t.name)}</span></button>`).join('')||'<div class="context-help">没有匹配的私人会话</div>'}<div class="context-label">团队共同会话</div>${f.filter(t=>t.scope==='team').map(t=>`<button class="side-item ${state.thread===t.id?'active':''}" onclick="navThread('${t.id}')">${ico('users')}<span>${esc(t.name)}</span></button>`).join('')||'<div class="context-help">没有匹配的团队会话</div>'}<div class="context-help">私人内容不会自动进入团队会话。<br>演示消息仅在本页面内保留。</div></div><div class="context-bottom"><span>CHAT / 私人与团队隔离</span>${ico('lock',13)}</div>`;
 }else{s=`<div class="context-head"><div class="context-title">研究台</div></div><div class="context-scroll"><div class="context-label">RESEARCH DESK</div>${researchItems.map(t=>`<button class="side-item ${state.module===t.id?'active':''}" onclick="setModule('${t.id}')">${ico(t.icon)}<span>${t.label}</span></button>`).join('')}<div class="context-label" style="margin-top:27px">使用说明</div><div class="context-help">研究台提供专业研究、统计、报告与资料管理。<br><br>AI 对话是独立一级入口，不与这些子模块平铺。</div></div><div class="context-bottom"><span>DESK / 专业工作区</span>${ico('layers',14)}</div>`}
 document.getElementById('context').innerHTML=s;document.getElementById('context').classList.toggle('open',state.mobile)}
function renderContextPreserve(){const sel=document.getElementById('threadSearch');const i=sel?.selectionStart;renderContext();const n=document.getElementById('threadSearch');if(n){n.focus();n.setSelectionRange(i,i)}}
function sectionHeader(k,t,d='',action=''){return `<div class="page-head"><div><div class="kicker">${k}</div><h1 class="title">${t}</h1>${d?`<p class="subtitle">${d}</p>`:''}</div>${action?`<div class="action-row">${action}</div>`:''}</div>`}
function tabs(items,current,handler){return `<div class="tabbar" role="tablist">${items.map(x=>`<button class="tab ${x===current?'active':''}" role="tab" aria-selected="${x===current}" onclick="${handler}('${x}')">${x}</button>`).join('')}</div>`}
function enterChat(task){state.space='chat';render();toast(task?'已进入对话。可在此继续研究讨论。':'已切换到对话')}
function renderChat(){const t=threads.find(x=>x.id===state.thread)||threads[0];const team=t.scope==='team';let demo=team?[{who:'user',name:'研究成员 A',text:'本周有哪些值得团队跟进的城市研究方法？'},{who:'bot',name:'Research Agent',text:'可以先查看本期 A/B/C 来源的研究信号，再根据团队画像判断相关性。这里展示的是样机文字，不是模型的真实研究结论。'}]:[{who:'user',name:'我',text:'如何把城市健康研究中的外部验证问题与新的计算方法结合？'},{who:'bot',name:'Research Agent',text:'建议先整理多个城市的研究场景、标注分布和环境差异，再选择需要比较的方法。请在正式系统中查看原始论文证据和独立验证结果。'}];const msgs=[...demo,...(state.localMessages[t.id]||[])];return `<div class="chat-layout"><div class="chat-body"><div class="chat-heading"><div><h1>${esc(t.name)}</h1><div class="scope-line">${ico(team?'users':'lock',13)} ${team?'团队共同会话 · 授权成员可查看':'私人会话 · 仅本人可见'} <span style="color:#ccc">/</span> ${team?'发言不自动调用模型':'可发起定向研究任务'}</div></div><div class="action-row"><button class="outline-btn" onclick="state.evidence=!state.evidence;render()">${ico('book',14)} 证据 / 任务</button></div></div><div class="chat-scroll" id="chat-scroll">${msgs.map(m=>`<div class="chat-msg ${m.who==='user'?'user':'bot'}"><div class="chat-avatar">${m.who==='user'?'研':'RA'}</div><div class="chat-text"><div class="speaker">${esc(m.name)}</div>${esc(m.text).replace(/\n/g,'<br>')}${m.who==='bot'?`<div class="chat-proof" onclick="state.evidence=true;render()">${ico('book',15)} <span style="flex:1">查看引用、工具与执行记录（演示）</span>${ico('chevron',13)}</div>`:''}</div></div>`).join('')}</div><div class="compose-wrap"><div class="composer"><textarea id="chat-input" placeholder="输入研究问题，或调用科研任务…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea><div class="composer-bottom"><div class="action-row"><button class="text-btn" onclick="toast('演示：选择科研任务；正式产品将启动有权限的工作流')">${ico('plus',15)} 工具 / Agent</button><button class="text-btn" onclick="state.space='research';state.module='topics';render();toast('可在研究台选择专题并关联成果')">${ico('folder',15)} 关联专题</button></div><button class="send" onclick="sendMessage()" aria-label="发送消息">${ico('send',15)}</button></div></div><p style="text-align:center;color:#aaa;font-size:10px;margin:9px 0 0">样机不发送模型请求；发送内容仅在本次页面会话中显示。</p></div></div>${state.evidence?`<aside class="evidence-panel"><div class="section-heading"><h2>证据与任务</h2><button class="text-btn" onclick="state.evidence=false;render()">${ico('close',15)}</button></div><div class="evidence-label">关联来源（示意）</div><div class="evidence-item"><b>论文检索记录</b><p>实际产品需保存 DOI / 来源页面 / 检索时间，不能凭空生成出处。</p></div><div class="evidence-item"><b>研究任务</b><p>状态：尚未调用后端<br>历史运行、模型和工作流版本可在这里查看。</p></div><div class="evidence-item"><b>共享与沉淀</b><p>选中对话内容后可关联专题或提交知识候选；不默认共享整个私人会话。</p></div><div style="padding-top:20px"><button class="outline-btn" onclick="state.space='research';state.module='knowledge';render()">查看知识资产 ${ico('arrow',13)}</button></div></aside>`:''}</div>`}
function sendMessage(){const el=document.getElementById('chat-input');const msg=el?.value.trim();if(!msg)return;const arr=state.localMessages[state.thread]||[];arr.push({who:'user',name:'我',text:msg});arr.push({who:'bot',name:'演示提示',text:'这是静态 HTML 原型，尚未连接 AI 模型。研究任务需要接入实际 Agent、权限及证据服务。'});state.localMessages[state.thread]=arr;render();const sc=document.getElementById('chat-scroll');if(sc)sc.scrollTop=sc.scrollHeight}
function selectTopic(id){state.topicId=id;state.topicTab='概览';render()}
function renderTopics(){if(!state.topicId){const action=`<button class="solid-btn" onclick="toast('演示：新建研究专题表单，正式产品需保存到数据库')">${ico('plus',14)} 新建专题</button>`;return `<div class="content-page">${sectionHeader('RESEARCH DESK / TOPICS','研究专题','按研究问题长期保存讨论、证据、任务与决策。',action)}<div class="filterrow"><div class="pills"><button class="pill on">全部</button><button class="pill" onclick="toast('原型筛选示意：进行中')">进行中</button><button class="pill" onclick="toast('原型筛选示意：待审查')">待审查</button></div><input id="topic-search" type="search" class="search-under" placeholder="搜索研究专题" oninput="filterTopics(this.value)"></div><div class="project-grid" id="topic-grid">${examples.topics.map(t=>topicCard(t)).join('')}</div><p class="demo-note">此处专题名称、状态和数量均为演示信息，不代表实际数据库记录。</p></div>`}const t=examples.topics.find(x=>x.id===state.topicId)||examples.topics[0];return `<div class="content-page"><button class="text-btn" onclick="state.topicId=null;render()">← 返回专题列表</button><div class="detail-intro" style="margin-top:16px"><div><span class="tag">${t.status}</span><h2>${esc(t.title)}</h2><p>${esc(t.desc)}</p><div class="action-row"><button class="outline-btn" onclick="enterChat(true)">${ico('chat',14)} 发起讨论</button><button class="outline-btn" onclick="toast('演示：编辑专题资料')">编辑专题</button></div></div><div class="detail-stats"><div><b>12</b><small>关联来源 · 示例</small></div><div><b>4</b><small>待办任务 · 示例</small></div><div><b>3</b><small>讨论记录 · 示例</small></div><div><b>2</b><small>待审查结果 · 示例</small></div></div></div>${tabs(['概览','讨论','证据','任务','决策'],state.topicTab,'setTopicTab')}<div class="panel panel-pad">${topicTabContent(t)}</div></div>`}
function topicCard(t){return `<article class="list-card project-card" data-name="${esc(t.title)}" onclick="selectTopic('${t.id}')"><div class="arrow-corner">${ico('up',17)}</div><div><span class="tag">${esc(t.status)}</span><h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p></div><div class="meta"><span>${esc(t.owner)}</span><span>更新 ${t.updated}</span><span>关联 ${t.count} 条</span></div></article>`}
function filterTopics(q){document.querySelectorAll('#topic-grid .project-card').forEach(el=>el.style.display=el.dataset.name.includes(q)?'':'none')}
function setTopicTab(s){state.topicTab=s;render()}
function topicTabContent(t){if(state.topicTab==='概览')return `<div class="section-heading"><h2>研究问题与当前进展</h2><span class="tag">专题详情</span></div><p class="subtitle">${esc(t.desc)} 该区域放置真实研究目标、已确认限制和本周待推进事项。</p><div class="rule"></div><div class="section-heading"><h2>最近关联内容</h2><button class="text-btn" onclick="state.topicTab='证据';render()">查看证据 ${ico('arrow',12)}</button></div>${rowDoc('本期相关论文与方法候选','来源需经核实','file')}${rowDoc('研究讨论摘要','仅授权共享内容可引用','chat')}`;if(state.topicTab==='讨论')return `<div class="section-heading"><h2>关联讨论</h2><button class="outline-btn" onclick="enterChat(true)">打开对话 ${ico('arrow',13)}</button></div>${rowDoc('团队关于研究方法的讨论','团队会话 · 示例','chat')}${rowDoc('研究问题定义与待核查项','讨论摘要 · 示例','file')}`;if(state.topicTab==='证据')return `<div class="section-heading"><h2>关联证据与资料</h2><button class="outline-btn" onclick="state.module='knowledge';render()">知识资产 ${ico('arrow',13)}</button></div>${rowDoc('跨领域文献证据索引','需链接 DOI / Work ID','book')}${rowDoc('研究方法与适用条件','需保留来源和审核状态','file')}`;if(state.topicTab==='任务')return `<div class="section-heading"><h2>研究任务</h2><span class="tag">模型与任务状态需真实读取</span></div>${rowDoc('整理来源论文及方法比较','计划中 · 示例','clock')}${rowDoc('验证候选方法的适用条件','待研究成员审核 · 示例','clock')}`;return `<div class="section-heading"><h2>团队决策</h2><span class="tag">有版本与审核记录</span></div><div class="timeline"><div class="timeline-entry"><h3>方法选择尚待验证</h3><p>示例决策节点。正式版本需记录责任人、证据与审核过程。</p></div><div class="timeline-entry"><h3>保留研究问题的开放性</h3><p>不将模型建议直接视为科学结论。</p></div></div>`}
function rowDoc(t,d,icon){return `<div class="document-row"><div class="document-icon">${ico(icon,17)}</div><div class="grow"><b>${t}</b><p>${d}</p></div>${ico('chevron',15)}</div>`}
function setDiscoveryTab(t){state.discoveryTab=t;render()}
function setSource(t){state.source=t;render()}
function renderDiscovery(){const action=`<button class="outline-btn" onclick="enterChat(true)">${ico('chat',14)} 深入讨论</button>`;let html=`<div class="content-page">${sectionHeader('RESEARCH DESK / DISCOVERY','科研发现','A 规划应用、B 城市科学前沿、C 计算方法。客观统计与 AI 判断分层呈现。',action)}${tabs(['信号','来源监测','科研周报','研究机会'],state.discoveryTab,'setDiscoveryTab')}`;
 if(state.discoveryTab==='信号'){const ss=examples.signals.filter(x=>state.source==='全部'||x.kind===state.source).filter(x=>(x.title+x.desc).includes(state.signalQuery));const years=[...new Set(ss.map(x=>x.year))];html+=`<div class="filterrow"><div class="pills">${['全部','A','B','C'].map(k=>`<button class="pill ${state.source===k?'on':''}" onclick="setSource('${k}')">${k==='全部'?'全部研究':k+' · '+({'A':'规划应用','B':'城市科学','C':'计算方法'}[k])}</button>`).join('')}</div><input class="search-under" placeholder="搜索研究信号" value="${esc(state.signalQuery)}" oninput="state.signalQuery=this.value;updateSignals()"></div><div id="signals-list">${signalTimeline(years,ss)}</div>`}
 else if(state.discoveryTab==='来源监测'){html+=`<div class="metric-row">${[['3','来源分组'],['A / B / C','独立扫描'],['L0 → L3','分析层次'],['待审核','质量状态']].map(x=>`<div class="metric"><small>${x[1]}</small><b>${x[0]}</b><small>结构示意 · 非实时数据</small></div>`).join('')}</div><div class="report-columns">${[['A','规划应用与研究实践','实际规划场景、新问题、数据与干预需求'],['B','城市科学前沿','测度、理论视角与研究问题的重构'],['C','计算方法与技术','算法、评测范式及可复用方法路径']].map(x=>`<article class="report-page"><span class="kicker">SOURCE ${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p><footer>检索窗口 / 来源覆盖 / 数据缺口 · 需真实记录</footer></article>`).join('')}</div>`}
 else if(state.discoveryTab==='科研周报'){html+=`<div class="filterrow"><span class="tag">团队周报 · 默认团队可见</span><div class="action-row"><button class="outline-btn" onclick="state.module='knowledge';state.knowledgeTab='研究画像';state.profileScope='personal';render()">个人画像 / 私人周报配置</button><button class="solid-btn" onclick="toast('演示：生成周报需真实后台任务')">生成报告</button></div></div><div class="report-columns">${[['01','规划与城市科学','A/B 来源的客观统计与研究变化','L0 统计 → L1 研究信号'],['02','技术方法','C 来源的新方法、技术路径与迁移约束','L0 统计 → L2 重点阅读'],['03','综合研究机会','有证据时提出可审核的研究切入点','L3 可选 · 不强制生成']].map(x=>`<article class="report-page"><span class="kicker">REPORT / ${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p><ul><li>原始来源和时间窗口</li><li>研究主题、证据与不确定性</li><li>适合后续讨论的研究动作</li></ul><footer>${x[3]}</footer></article>`).join('')}</div><p class="demo-note">周报数据需来自真实文献及任务记录。个人周报默认私人，不能自动发布到团队。</p>`}
 else{html+=`<div class="panel panel-pad"><div class="section-heading"><h2>持续研究机会池</h2><span class="tag">需要人工评审</span></div><table class="idea-table"><thead><tr><th>研究机会</th><th>关联来源</th><th>状态</th><th>下一步</th></tr></thead><tbody>${[['城市健康预测的跨区域泛化','A / C','待审查','外部验证设计'],['城市智能化测量的研究重构','B','探索中','指标与机制审查'],['区域水治理的方法与治理场景','A / C','证据不足','检查方法衔接']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td><span class="tag">${x[2]}</span></td><td><button class="text-btn" onclick="state.module='topics';render()">${x[3]} ${ico('arrow',12)}</button></td></tr>`).join('')}</tbody></table></div><p class="demo-note">跨来源组合必须说明数据与方法的相容性，不应仅为凑选题而强行配对。</p>`}
 return html+`</div>`}
function signalTimeline(years,ss){if(!years.length)return '<p class="muted">无匹配的演示研究信号</p>';return years.map(y=>`<div class="discovery-timeline"><div class="time-year">${y}</div><div class="time-line"></div><div class="signal-group">${ss.filter(x=>x.year===y).map(t=>`<article class="list-card signal-card" onclick="toast('演示：查看研究信号详情与原始论文证据')"><div class="arrow-corner">${ico('up',17)}</div><span class="label">${t.kind} / ${esc(t.label)}</span><h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p><div class="meta">${esc(t.meta)}</div></article>`).join('')}</div></div>`).join('')+`<p class="demo-note">时间轴为视觉演示，不代表真实 2025–2026 年研究统计结果。</p>`}
function updateSignals(){const ss=examples.signals.filter(x=>state.source==='全部'||x.kind===state.source).filter(x=>(x.title+x.desc).includes(state.signalQuery));document.getElementById('signals-list').innerHTML=signalTimeline([...new Set(ss.map(x=>x.year))],ss)}
function setKnowledgeTab(t){state.knowledgeTab=t;render()}
function setProfileScope(t){state.profileScope=t;render()}
function renderKnowledge(){const action=`<button class="outline-btn" onclick="toast('演示：新增知识需来源审核与权限校验')">${ico('plus',13)} 新建知识候选</button>`;let html=`<div class="content-page">${sectionHeader('RESEARCH DESK / KNOWLEDGE','知识资产','论文证据、抽象方法、研究画像与数据元信息集中检索与追溯。',action)}${tabs(['论文索引','抽象知识','研究画像','知识关系','数据资产'],state.knowledgeTab,'setKnowledgeTab')}`;
 if(state.knowledgeTab==='研究画像'){html+=`${tabs(['团队画像','个人画像'],state.profileScope==='team'?'团队画像':'个人画像','selectProfileTab')}<div class="profile-grid"><div class="panel profile-card"><div class="section-heading"><h3>${state.profileScope==='team'?'团队正式研究画像':'我的个人研究画像'}</h3><span class="tag">${state.profileScope==='team'?'团队共享 / 需审核':'私人 / 由本人管理'}</span></div><div class="profile-fields"><div class="profile-field"><label>研究方向</label><p>${state.profileScope==='team'?'城市科学、城市规划与跨学科方法研究（示例占位）':'城市健康模型的泛化、空间图学习、研究方法迁移（示例）'}</p></div><div class="profile-field"><label>方法与能力</label><p>${state.profileScope==='team'?'仅列经证据确认的团队能力，保持来源和状态。':'本人关注的方法、学习目标与实践经验，不自动成为团队能力。'}</p></div><div class="profile-field"><label>研究与数据范围</label><p>${state.profileScope==='team'?'团队已登记的成果与数据元信息，不默认拥有原始数据权限。':'本人参与的专题、关注论文、个人兴趣和私人笔记。'}</p></div></div><div class="rule"></div><button class="outline-btn" onclick="toast('演示：研究画像编辑需要真实账户及审核规则')">编辑画像 ${ico('arrow',13)}</button></div><div class="panel profile-card"><h3>画像关联的科研任务</h3>${rowDoc(state.profileScope==='team'?'团队科研周报':'个人科研周报',state.profileScope==='team'?'团队来源计划 · SC01':'个性化关注与独立私有输出 · SC02','file')}${rowDoc('临时定向科研任务','根据当次输入和可见资料运行 · SC03','chat')}<div class="rule"></div><p class="subtitle">个人画像与团队画像采用独立作用域；私人关注不因加入团队而自动共享。</p></div></div>`}
 else if(state.knowledgeTab==='知识关系'){html+=`<div class="graph"><svg viewBox="0 0 700 380" role="img" aria-label="抽象知识关系演示"><line x1="350" y1="187" x2="142" y2="98"/><line x1="350" y1="187" x2="544" y2="91"/><line x1="350" y1="187" x2="155" y2="290"/><line x1="350" y1="187" x2="547" y2="281"/><line x1="142" y1="98" x2="155" y2="290"/><line x1="544" y1="91" x2="547" y2="281"/><circle class="central" cx="350" cy="187" r="68"/><circle cx="142" cy="98" r="52"/><circle cx="544" cy="91" r="54"/><circle cx="155" cy="290" r="52"/><circle cx="547" cy="281" r="50"/><text class="central-label" x="350" y="192" text-anchor="middle">研究问题</text><text x="142" y="103" text-anchor="middle">方法</text><text x="544" y="96" text-anchor="middle">场景</text><text x="155" y="295" text-anchor="middle">数据</text><text x="547" y="286" text-anchor="middle">评价</text></svg></div><p class="demo-note">抽象关系示意。正式版本的每条边须追溯至原始来源与知识抽取证据。</p>`}
 else if(state.knowledgeTab==='数据资产'){html+=`<div class="panel panel-pad"><div class="section-heading"><h2>团队成果与数据目录</h2><span class="tag">仅元数据</span></div>${rowDoc('研究成果目录','经审核的论文、项目与团队贡献','book')}${rowDoc('CUSP 数据元信息','空间、时间覆盖及许可条件','database')}${rowDoc('团队方法能力','来源与确认状态','file')}</div><p class="demo-note">原始研究数据和私人文件不能因为出现在目录里就被系统自动读取。</p>`}
 else{const arr=state.knowledgeTab==='论文索引'?examples.knowledge.filter(x=>x.type==='论文'):examples.knowledge.filter(x=>x.type!=='论文');let selected=examples.knowledge.find(x=>x.id===state.knowledgeSelected)||examples.knowledge[0];html+=`<div class="knowledge-columns"><aside class="panel filter-pane"><h3>筛选</h3><button class="filter-opt active">全部状态</button><button class="filter-opt" onclick="toast('演示筛选：已验证')">已验证</button><button class="filter-opt" onclick="toast('演示筛选：待审核')">待审核</button><button class="filter-opt" onclick="toast('演示筛选：知识候选')">知识候选</button><div class="rule"></div><h3>知识类型</h3><button class="filter-opt" onclick="setKnowledgeTab('论文索引')">论文</button><button class="filter-opt" onclick="setKnowledgeTab('抽象知识')">研究问题 / 方法 / 场景</button></aside><section class="panel results-pane"><div class="section-heading"><h2>${state.knowledgeTab}</h2><span class="tag">示例列表</span></div><input class="thin-input" placeholder="搜索论文、研究问题与方法" id="knowledge-search" value="${esc(state.knowledgeQuery)}" oninput="state.knowledgeQuery=this.value;updateKnowledgeList()"><div id="knowledge-list">${arr.filter(x=>(x.title+x.desc).includes(state.knowledgeQuery)).map(knowledgeItem).join('')}</div></section><aside class="panel detail-pane"><div class="kicker">RECORD / PREVIEW</div><h3>${esc(selected.title)}</h3><p>${esc(selected.desc)}</p><div class="rule"></div><p><b>来源状态</b><br>${esc(selected.source)}</p><p><b>审核状态</b><br>${esc(selected.status)}</p><div class="rule"></div><button class="outline-btn" onclick="toast('演示：需要真实来源记录和权限验证')">查看来源 ${ico('up',13)}</button></aside></div>`}
 return html+`</div>`}
function selectProfileTab(s){state.profileScope=s==='团队画像'?'team':'personal';render()}
function knowledgeItem(x){return `<div class="knowledge-result" onclick="state.knowledgeSelected='${x.id}';render()"><span class="tag">${x.type}</span><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p><span class="micro muted">${esc(x.status)}</span></div>`}
function updateKnowledgeList(){const arr=state.knowledgeTab==='论文索引'?examples.knowledge.filter(x=>x.type==='论文'):examples.knowledge.filter(x=>x.type!=='论文');document.getElementById('knowledge-list').innerHTML=arr.filter(x=>(x.title+x.desc).includes(state.knowledgeQuery)).map(knowledgeItem).join('')||'<p class="subtitle">没有匹配的示例知识记录</p>'}
function setSettingTab(t){state.settingTab=t;render()}
function renderSettings(){const all=['成员与权限','模型与费用','学术来源与任务','运行与审计'];return `<div class="content-page">${sectionHeader('RESEARCH DESK / MANAGEMENT','管理与设置','成员、模型、来源配置、任务和审计集中在研究台内部。')}<div class="settings-grid"><aside class="panel settings-menu">${all.map(x=>`<button class="${state.settingTab===x?'active':''}" onclick="setSettingTab('${x}')">${x}</button>`).join('')}</aside><section class="panel settings-detail">${settingContent()}</section></div><p class="demo-note">本页开关和按钮仅是交互演示；不会修改真实模型、GitHub Actions、权限或数据库。</p></div>`}
function settingContent(){if(state.settingTab==='成员与权限')return `<h2>团队成员与权限</h2><p>正常业务 API 应区分管理员、研究成员和只读成员；不会默认开放他人的私人对话。</p><table class="settings-table"><thead><tr><th>成员</th><th>角色</th><th>允许操作</th><th>状态</th></tr></thead><tbody><tr><td>研究管理员</td><td>Admin</td><td>团队配置、成员、共享知识审核</td><td>示意</td></tr><tr><td>研究成员</td><td>Researcher</td><td>科研对话、研究专题、候选提交</td><td>示意</td></tr><tr><td>只读成员</td><td>Viewer</td><td>授权的团队资料浏览</td><td>示意</td></tr></tbody></table>`;if(state.settingTab==='模型与费用')return `<h2>模型与预算</h2><p>模型密钥保存在服务端；对话费用与周期科研任务费用分别记录。</p><div class="setting-card"><div><b>默认科研模型</b><small>管理员配置 / 密钥不在浏览器暴露</small></div><span class="tag">未连接</span></div><div class="setting-card"><div><b>模型预算与告警</b><small>团队与用户配额（待实现）</small></div><button class="outline-btn" onclick="toast('演示：预算设置功能')">配置</button></div>`;if(state.settingTab==='学术来源与任务')return `<h2>学术来源与任务</h2><p>分别配置 A 规划应用、B 城市科学、C 计算方法的期刊、会议和关键词；执行状态要有真实记录。</p><div class="setting-card"><div><b>三来源定期采集</b><small>演示开关，不会启停真实 GitHub Actions</small></div><button class="switch ${state.toggle?'on':''}" onclick="state.toggle=!state.toggle;render();toast('仅修改原型显示')" aria-label="切换演示采集开关"></button></div><div class="setting-card"><div><b>来源清单与监测周期</b><small>需要记录配置版本与审核责任人</small></div><button class="outline-btn" onclick="toast('演示：编辑来源配置')">配置</button></div>`;return `<h2>执行记录与审计</h2><p>任务运行、研究知识审核、团队画像修改均应保存操作者、时间、影响对象和变更原因。</p>${rowDoc('研究任务的真实执行轨迹','模型、工具、来源、用量、完成状态','clock')}${rowDoc('团队知识审核历史','修改前后版本、审核人及依据','file')}${rowDoc('开发变更记录','代码与设计更新通过 GitHub PR 追踪','external')}`}
function render(){document.querySelectorAll('.rail-btn[data-space]').forEach(b=>{b.classList.toggle('active',b.dataset.space===state.space);b.setAttribute('aria-current',b.dataset.space===state.space?'page':'false')});renderContext();const c=pageTitle();document.getElementById('crumb').innerHTML=`<span>${c[0]}</span> ${ico('chevron',12)} <strong>${esc(c[1])}</strong>`;document.getElementById('stage').innerHTML=state.space==='chat'?renderChat():state.module==='topics'?renderTopics():state.module==='discovery'?renderDiscovery():state.module==='knowledge'?renderKnowledge():renderSettings()}
document.getElementById('icon-chat').innerHTML=ico('chat',21);document.getElementById('icon-research').innerHTML=ico('layers',22);document.getElementById('icon-user').innerHTML=ico('user',20);document.getElementById('icon-menu').innerHTML=ico('menu',20);document.getElementById('icon-search').innerHTML=ico('search',16);
document.querySelectorAll('.rail-btn[data-space]').forEach(b=>b.addEventListener('click',()=>setSpace(b.dataset.space)));
document.getElementById('mobile-menu').addEventListener('click',()=>{state.mobile=!state.mobile;renderContext()});document.getElementById('global-search').addEventListener('click',()=>toast('演示：全局搜索需关联对话、论文、专题与知识索引'));
render();
</script>
</body>
</html>
