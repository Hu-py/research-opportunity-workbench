# This repository is a monorepo. Vercel's Project Root Directory is
# already configured as "frontend", so run CLI from the *repository root*.
# Build remotely at Vercel: sensitive Production secrets are not retrievable
# by a CI runner and local prebuilt builds would see "[SENSITIVE]" placeholders.
name: Deploy Research Atlas to Vercel Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-vercel-production.yml"

permissions:
  contents: read

concurrency:
  group: research-atlas-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy reviewed main from repository root
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: team_AJPdxeeAHVMuBFUh4fHVFqcl
      VERCEL_PROJECT_ID: prj_v88I5Sy7PwDabkWSDiV9zQFjEdgq
      VERCEL_SCOPE: bo-o-o-o-o-m
      PRODUCTION_URL: https://research-opportunity-workbench.vercel.app

    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Verify repository and frontend directories
        run: |
          test -f frontend/package.json
          test -f frontend/next.config.ts
          test -f .github/workflows/deploy-vercel-production.yml

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@66.6.0

      - name: Verify deployment credential is configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Repository secret VERCEL_TOKEN is not configured."
            exit 1
          fi

      - name: Link repository root to the existing Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel link --yes --project research-opportunity-workbench --scope "$VERCEL_SCOPE"

      - name: Deploy source to Production with Vercel-hosted build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Project Root Directory is configured as frontend in Vercel.
          # Do not chdir into frontend here: that creates frontend/frontend.
          # Remote builds can access Production secrets on Vercel.
          vercel deploy --prod --yes --scope "$VERCEL_SCOPE"

      - name: Verify production homepage and session endpoint
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 80 "$PRODUCTION_URL/" -o /dev/null
          status="$(curl --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 80 -o /dev/null -w '%{http_code}' "$PRODUCTION_URL/api/session")"
          test "$status" = "200"

      - name: Write deployment summary
        run: |
          {
            echo "## Research Atlas Production Deployment"
            echo
            echo "- Target: Production"
            echo "- URL: $PRODUCTION_URL"
            echo "- Commit: $GITHUB_SHA"
            echo "- Project root: repository root (Vercel rootDirectory=frontend)"
            echo "- Build: Vercel-hosted, with Production secrets available"
            echo "- Smoke test: homepage and session endpoint returned HTTP 200"
          } >> "$GITHUB_STEP_SUMMARY"
