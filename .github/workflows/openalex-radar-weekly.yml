name: Weekly OpenAlex public radar feed

on:
  workflow_dispatch:
  schedule:
    # 06:00 every Monday in China Standard Time.
    - cron: '0 6 * * 1'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: weekly-openalex-public-feed
  cancel-in-progress: false

jobs:
  collect:
    name: Retrieve and publish public academic metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check required OpenAlex credential
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENALEX_API_KEY:-}" ]; then
            echo 'Missing OPENALEX_API_KEY repository secret. Add it under Settings > Secrets and variables > Actions.' >&2
            exit 1
          fi
      - name: Collect annual counts and recent work metadata
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/openalex_weekly_radar.py
      - name: Validate public feed structure and freshness metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          path = Path("data/radar/openalex_latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data.get("schema_version") == "2.0.0", "Unexpected schema_version"
          datetime.fromisoformat(data["retrieved_at_utc"].replace("Z", "+00:00"))
          assert isinstance(data.get("source_coverage"), dict) and data["source_coverage"], "Missing source_coverage"
          assert isinstance(data.get("topic_candidates"), list) and data["topic_candidates"], "No topic candidates"
          assert isinstance(data.get("recent_papers"), list) and data["recent_papers"], "No recent papers"
          assert len(data["recent_papers"]) <= 240, "Recent paper cap exceeded"
          print("Validated OpenAlex feed:", len(data["topic_candidates"]), "topics;",
                len(data["recent_papers"]), "papers;",
                len(data.get("warnings", [])), "warnings")
          PY
          sha256sum data/radar/openalex_latest.json
      - name: Preserve result as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-openalex-public-radar
          path: data/radar/openalex_latest.json
          if-no-files-found: error
          retention-days: 30
      - name: Update stable public JSON feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- data/radar/openalex_latest.json
          if git diff --cached --quiet; then
            echo "No feed changes to publish"
          else
            git commit -m "data(radar): refresh public OpenAlex weekly feed"
            git push origin HEAD:main
          fi
