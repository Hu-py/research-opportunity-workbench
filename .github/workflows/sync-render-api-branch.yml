name: Keep Render API deployment ref aligned with main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-render-ref:
    name: Sync Render API branch alias to main
    runs-on: ubuntu-latest
    steps:
      - name: Move deployment alias to the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/git/refs/heads/feat/shared-team-workspace" \
            -d "{\"sha\":\"${MAIN_SHA}\",\"force\":true}"
