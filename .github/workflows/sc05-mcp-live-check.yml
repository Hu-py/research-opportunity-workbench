name: SC05 live public OAuth scope check
on:
  workflow_dispatch:
  push:
    branches: [experiment/devstudio-postgres-e2e-20261114]
    paths:
      - .github/workflows/sc05-mcp-live-check.yml
permissions:
  contents: read
jobs:
  scoped-oauth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify isolated Render public endpoints (zero provider calls)
        env:
          SC05_MCP_URL: https://research-atlas-devstudio-e2e-ejmh.onrender.com
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --max-time 60 "${SC05_MCP_URL}/api/health" > /dev/null
          curl -fsS --retry 3 --max-time 60 "${SC05_MCP_URL}/.well-known/oauth-protected-resource" > resource.json
          python - <<'PY'
          import json
          data=json.load(open("resource.json",encoding="utf-8"))
          assert data["resource"]=="https://research-atlas-devstudio-e2e-ejmh.onrender.com/mcp"
          assert {"experiments:read","experiments:run"}.issubset(set(data["scopes_supported"]))
          print("resource metadata: PASS; scopes available")
          PY
          status=$(curl -sS --max-time 60 -D headers.txt -o response.txt -w '%{http_code}' \
            -X POST "${SC05_MCP_URL}/mcp" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":101,"method":"tools/list"}')
          test "$status" = "401"
          python - <<'PY'
          from pathlib import Path
          header=Path("headers.txt").read_text(encoding="utf-8").lower()
          assert "www-authenticate: bearer" in header
          assert 'scope="experiments:read experiments:run"' in header
          assert 'resource_metadata="https://research-atlas-devstudio-e2e-ejmh.onrender.com/.well-known/oauth-protected-resource"' in header
          print("OAuth first-challenge run scope: PASS")
          PY
          echo "SC05 LIVE HTTP PROBE PASS. DeepSeek API calls=0."
