name: SC05 R6.6 held-out OpenAlex silver benchmark

on:
  workflow_dispatch:
  # Only first submission/reopening of a new evaluation PR, not every doc update.
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - 'benchmarks/sc05_r66_silver_set_v01.json'
      - 'scripts/sc05_r66_eval.py'
      - 'tests/test_sc05_r66_eval.py'
      - '.github/workflows/sc05-r66-openalex-eval.yml'

permissions:
  contents: read

concurrency:
  group: sc05-r66-silver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heldout-retrieval:
    name: DOI-grounded academic retrieval check (no DeepSeek)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal API and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Offline tests first (no network or paid API)
        run: python -m pytest -q tests/test_sc05_r66_eval.py tests/test_sc05_relevance.py
      - name: Live public OpenAlex DOI lookup (bounded to 16 HTTP requests)
        id: live
        # Nonblocking: public no-key requests may be throttled. Never accept
        # this job as an evidence-quality PASS unless JSON says coverage=1.
        continue-on-error: true
        env:
          OPENALEX_API_KEY: ''
        run: |
          mkdir -p artifacts
          python -m scripts.sc05_r66_eval \
            --manifest benchmarks/sc05_r66_silver_set_v01.json \
            --live --max-requests 16 --delay-seconds 1.05 \
            --output artifacts/sc05_r66_retrieval_metrics.json \
            --strict-coverage > artifacts/sc05_r66_retrieval_stdout.json
      - name: Upload only safe metadata and aggregate metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc05-r66-silver-benchmark
          path: |
            artifacts/sc05_r66_retrieval_metrics.json
            artifacts/sc05_r66_retrieval_stdout.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Report live check metrics and warnings
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path("artifacts/sc05_r66_retrieval_metrics.json")
          summary=Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a",encoding="utf-8") as f:
              f.write("## SC05 R6.6 zero-DeepSeek benchmark\n")
              if not path.exists():
                  f.write("No metrics artifact. No scholarly quality acceptance.\n")
                  print("::warning::R6.6 OpenAlex metrics file missing; do not treat CI success as retrieval validation.")
              else:
                  data=json.loads(path.read_text(encoding="utf-8"))
                  m=data["metrics"]
                  f.write("Status: "+data["evaluation_status"]+"\n\n")
                  f.write("OpenAlex DOI requests: "+str(m["api_requests"])+"; DeepSeek calls: 0\n\n")
                  f.write("Metadata coverage: "+str(m["metadata_coverage"])+"\n\n")
                  f.write("Provisional domain precision: "+str(m["domain_precision_provisional"])+"\n\n")
                  f.write("Method-transfer quarantine: "+str(m["method_transfer_quarantine_rate"])+"\n\n")
                  f.write("Gold labels: NOT independently adjudicated; novelty NOT certified.\n")
                  if data["evaluation_status"]!="complete_silver_not_gold":
                      print("::warning::R6.6 OpenAlex evidence incomplete; do not interpret green CI as full benchmark PASS.")
          PY
